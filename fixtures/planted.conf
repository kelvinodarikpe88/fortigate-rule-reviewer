#config-version=FGT-7.4.4-FW-build2662-240415
config firewall address
    edit "web-server"
        set subnet 10.0.1.10 255.255.255.255
    next
    edit "mgmt-range"
        set subnet 10.0.9.0 255.255.255.0
    next
    edit "vendor-host"
        set subnet 203.0.113.9 255.255.255.255
    next
end
config firewall policy
    edit 1
        set name "allow-web"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-server"
        set service "HTTPS"
        set action accept
        set logtraffic all
    next
    edit 2
        set name "any-any-out"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set logtraffic disable
    next
    edit 3
        set name "mgmt-from-wan"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "mgmt-range"
        set service "SSH" "HTTPS"
        set action accept
        set logtraffic all
    next
    edit 4
        set name "temp-vendor"
        set comments "TEMP access for vendor"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "vendor-host"
        set service "SMB"
        set action accept
        set logtraffic all
    next
    edit 5
        set name "shadowed-rule"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "HTTP"
        set action accept
        set logtraffic all
    next
    edit 6
        set name "dead-deny"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set logtraffic all
    next
    edit 7
        set name "dupe-of-web"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-server"
        set service "HTTPS"
        set action accept
        set logtraffic all
    next
    edit 8
        set name "broken-ref"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "undefined-group"
        set dstaddr "vendor-host"
        set service "HTTPS"
        set action accept
        set logtraffic all
    next
    edit 9
        set name "allow-http-anywhere"
        set srcintf "internal"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set service "HTTP"
        set action accept
        set logtraffic all
    next
end
