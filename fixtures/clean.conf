#config-version=FGT-7.4.4-FW-build2662-240415
config firewall address
    edit "web-server"
        set subnet 10.0.1.10 255.255.255.255
    next
    edit "db-server"
        set subnet 10.0.2.20 255.255.255.255
    next
end
config firewall policy
    edit 1
        set name "inbound-web"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-server"
        set service "HTTPS"
        set action accept
        set logtraffic all
    next
    edit 2
        set name "web-to-db"
        set srcintf "internal"
        set dstintf "internal"
        set srcaddr "web-server"
        set dstaddr "db-server"
        set service "SMB"
        set action accept
        set logtraffic all
    next
    edit 3
        set name "deny-all"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set logtraffic all
    next
end
